name: Daily Catalog Scraper

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      only_suppliers:
        description: 'ריק = כל הספקים (ריצה יומית מלאה). אחרת שמות מופרדים בפסיק, למשל: samsung או samsung,atomic'
        required: false
        default: ''

jobs:
  scrape:
    # רץ על ה-runner העצמאי (DESKTOP-T24MMUB) ולא על GitHub cloud runners:
    # Semicom חסום ע"י Cloudflare על IP-ים של GitHub Actions הענן, אבל לא
    # על ה-IP הביתי/עסקי של המחשב הזה.
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCRAPER_USER: ${{ secrets.SCRAPER_USER }}
          CDATA_USER: ${{ secrets.CDATA_USER }}
          CDATA_PASS: ${{ secrets.CDATA_PASS }}
          MORLEVI_USER: ${{ secrets.MORLEVI_USER }}
          MORLEVI_PASS: ${{ secrets.MORLEVI_PASS }}
          AMTEL_USER: ${{ secrets.AMTEL_USER }}
          AMTEL_PASS: ${{ secrets.AMTEL_PASS }}
          ATOMIC_USER: ${{ secrets.ATOMIC_USER }}
          ATOMIC_PASS: ${{ secrets.ATOMIC_PASS }}
          CMS_USER: ${{ secrets.CMS_USER }}
          CMS_PASS: ${{ secrets.CMS_PASS }}
          # Samsung: קובץ מקומי, אין צורך בהתחברות/סודות
          # ריצה סלקטיבית — ריק כברירת מחדל בריצה המתוזמנת (מריץ הכול)
          ONLY_SUPPLIERS: ${{ github.event.inputs.only_suppliers }}
        run: node scraper.js

      - name: Notify on failure
        if: failure()
        run: echo "Scraper failed"
